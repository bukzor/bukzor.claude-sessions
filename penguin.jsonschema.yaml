# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
title: Penguin Frontmatter
description: >
  Frontmatter for penguin.kb/ collection items.
type: object
required: []
additionalProperties: false
properties:
  color:
    description: Color
    type: string
    enum: ['pink', 'yellow']
  cost-benefit-sweh:
    description: Cost benefit sweh
    type: string
  cwd:
    description: Working directory
    type: string
  focus:
    description: Focus
    type: array
    items:
      type: string
  parent:
    description: Parent
    type: string
    enum: ['backlog-triage-with-cost-of-delay.md']
  provenance:
    description: Provenance
    type: array
    items:
      type: string
  session:
    description: Session identifier
    type: string
